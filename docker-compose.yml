services:

  nginx:
    container_name: decampoacampo_nginx
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-80}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  app:
    container_name: decampoacampo_app
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: .docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: decampoacampo_mysql
    environment:
      MYSQL_DATABASE: decampoacampo
      MYSQL_USER: decampoacampo
      MYSQL_PASSWORD: decampoacampo
      MYSQL_ROOT_PASSWORD: root-decampoacampo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: node:22-bookworm
    container_name: decampoacampo_frontend
    working_dir: /app
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: >
      sh -c "
      npm install &&
      npm run dev -- --host 0.0.0.0
      "
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mysql_data:
  frontend_node_modules:
